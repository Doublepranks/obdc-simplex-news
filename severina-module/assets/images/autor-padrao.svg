  <path d="M125 172c-38 0-68 25-74 59 22 12 47 18 74 18s52-6 74-18c-6-34-36-59-74-59z"
        fill="#5c5851"/>

  <!-- Acento dourado do tema (#ba8138) -->
  <circle cx="125" cy="120" r="55" fill="none" stroke="#ba8138" stroke-width="1.5" opacity="0.55"/>
  <rect x="0" y="336" width="250" height="4" fill="#ba8138"/>
</svg>
